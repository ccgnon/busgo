services:
  # ─── Backend API (Node.js + Express + Prisma) ───────────────────────────
  - type: web
    name: busgo-back
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: busgo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: busgo-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://busgo-4q84.onrender.com
      # ── SMS Africa's Talking (sandbox) ──
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        value: sandbox
      # ── Email SMTP (optionnel) ──
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # ── Agent Telegram ──
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ─── Frontend React (static site) ───────────────────────────────────────
  - type: static
    name: busgo
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_URL
        value: https://busgo-back.onrender.com

  # ─── Agent IA Telegram "Baobab" ─────────────────────────────────────────
  - type: worker
    name: busgo-agent
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: agent
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BUSGO_API_URL
        value: https://busgo-back.onrender.com/api

databases:
  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────
  - name: busgo-db
    databaseName: busgo_db
    user: busgo_user
    plan: free
    region: oregon
    version: "16"

  # ─── Redis / Key Value ──────────────────────────────────────────────────
  - name: busgo-redis
    type: redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
